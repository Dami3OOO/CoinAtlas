name: Record snapshot

# Twice a day, so one failed run does not lose the day. The later run overwrites the earlier one.
on:
  schedule:
    - cron: "15 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: record-snapshot

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The headless browser reads the list from the page itself. Without it the script falls back to a public top 200.
      - name: Install headless browser
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: node scripts/record-snapshot.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Record snapshot $(date -u +%F)"
          git pull --rebase
          git push
