name: Probe staking sources

# Temporary: checks which free sources answer for native staking rates. Prints only, commits nothing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-staking.mjs
